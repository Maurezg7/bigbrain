[package]
name = "bigbrain-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
pulldown-cmark = "0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "cors"] }
